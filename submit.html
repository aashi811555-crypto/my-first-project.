<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            box-sizing: border-box;
        }
        html,body{
            width: 100%;
            height: 100%;

        }

        input{
            display: block;
        }

        #main{
            padding: 30px;
            width: 100%;
            height: 100%;
            background-color: rgba(3, 205, 87, 0.76);
        }

        #btn {
            padding: 10px 50px;
            background-color: rgb(16, 200, 148);
            color: white;
            font-weight: 300;
            border-radius: 100px;
        }

        .card{
            max-width: 300px;
            color: #fff;
            margin-top: 40px;
            border-radius: 10px;
            display: inline-block;
            padding: 30px;
            border: 1px solid#f90404;

        }
        .profile{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            

        }
        .card h5{
            margin-top: 3px;
            color: black;
        }
        .card p{
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="profile pic">
            <input type="text" placeholder="name">
            <input type="text" placeholder="occupation">
            <input type="text" placeholder="info">
            <input type="submit">

        </form>
        
            
    </div>
    
   
    <script src="submit.js"></script>
</body>
</html >
