<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            box-sizing: border-box;
        }
        html,body{
            width: 100%;
            height: 100%;

        }

        #main{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: rgb(219, 223, 223);
        }

        input{
            display: none;
        }

        #btn {
            padding: 10px 50px;
            background-color: rgb(16, 200, 148);
            color: white;
            font-weight: 300;
            border-radius: 100px;
        }

        #btn:hover{
            background-color: rgb(5, 40, 28);
        }
    </style>
</head>
<body>
   <div id="main">
    <input id="fileinp" type="file">
    <div id="btn">
        Upload File 📤
    </div>
   </div>
    <script src="upload file.js"></script>
